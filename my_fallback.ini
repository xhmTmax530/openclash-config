[custom]
; ============================================================
;  OpenClash 分流转换模板 · 极简版  【主用版】
;  设计目标：国内直连 / 其余全走代理 / 节点按国家顺位容灾
;
;  规则源：raw.githubusercontent.com（与原方案作者写法一致）
;  【前提】subconverter 必须已配置 proxy_ruleset 走代理，
;          否则该域名被 SNI 阻断，规则会被【静默丢弃】！
;  【代理不可用时】改用 my_fallback_jsdelivr.ini
; ============================================================

; ---------- 1. 直连白名单 ----------
; 内网 / 保留地址，必须置顶，防止局域网互访被推进代理
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list

; 国内高频域名（实测 683 条有效规则）
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list

; 国内企业 IP 段（阿里/腾讯/字节等）
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list

; 【防 DNS 泄露】按 GeoIP 判定国内 IP，no-resolve 表示"是域名就先跳过，不许本地解析"
ruleset=🎯 全球直连,[]GEOIP,CN,no-resolve

; ---------- 2. 明确要走代理的 ----------
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list

; ---------- 3. 兜底：一切未命中 → 全部走代理 ----------
ruleset=🚀 节点选择,[]FINAL

; ============================================================
;  策略组：容灾顺位 = 美 → 日 → 新 → 台 → 韩 → 英 → 土 → 港 → 其余
;  写法说明（重要）：
;    国家之间用 ` 分隔，直接写正则，绝对不要写成 []香港
;    [] 前缀是"引用已存在的策略组"，写 []香港 会生成不存在的节点名
;    最后一个 .* 表示"剩下的节点全收进来"，保证永不为空
; ============================================================
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动容灾`[]⚡ 自动测速`[]DIRECT`.*

custom_proxy_group=♻️ 自动容灾`fallback`美国|United States`日本|Japan`新加坡|Singapore|狮城`台湾|Taiwan`韩国|Korea`英国|United Kingdom|Britain`土耳其|Turkey`香港|Hong`.*`http://www.gstatic.com/generate_204`180,,50

; 独立测速组：不按顺位，永远挑当前延迟最低的节点（备用手动切换用）
custom_proxy_group=⚡ 自动测速`url-test`.*`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
